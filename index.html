<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24123f"><title>הורוסקופ ייחודי</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Arial,sans-serif;color:#fff;text-align:center;background:radial-gradient(ellipse at 50% 20%,#5b3a93 0%,#24123f 52%,#09091c 100%);overflow:hidden}main{padding:12vh 18px 20px}h1{font-size:clamp(34px,9vw,64px);margin:0 0 18px;text-shadow:0 5px 22px #0006}.orb{margin:30px auto;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#ffddab,#c879f5 45%,#4d2c84 76%);box-shadow:0 0 65px #bc75ff99}button{font-family:inherit;touch-action:manipulation}.moving{position:fixed;left:50%;top:68%;translate:-50% -50%;z-index:4;border:2px solid #f9d8ff;background:#fff;color:#301b50;border-radius:999px;padding:18px 44px;font-weight:800;font-size:24px;box-shadow:0 7px 26px #0008;transition:left .17s ease,top .17s ease}.stop{position:fixed;bottom:max(6px,env(safe-area-inset-bottom));right:6px;z-index:9;width:22px;height:22px;background:#60243b;color:#fff;border:1px solid #8a5670;border-radius:50%;padding:0;font-size:10px;line-height:20px;font-weight:400;opacity:.55}.retry{position:fixed;top:53%;left:50%;translate:-50% -50%;width:min(88vw,380px);padding:18px 20px;background:#f5d681;color:#29183b;border:0;border-radius:16px;font-size:22px;font-weight:800;z-index:7;box-shadow:0 8px 25px #0009}.hidden{display:none}</style></head><body><main><h1>🔮 הורוסקופ ייחודי</h1><div class="orb" aria-hidden="true"></div></main><button id="close" class="moving">סגירה</button><button id="retry" class="retry hidden">🔊 געו להפעלת ההורוסקופ</button><button id="stop" class="stop" aria-label="עצירת שמע" title="עצירת שמע">■</button><audio id="voice" loop preload="auto" src="voice.m4a"></audio><script>const a=document.getElementById('voice'),move=document.getElementById('close'),stop=document.getElementById('stop'),retry=document.getElementById('retry');let taps=0;let halted=false;a.loop=true;a.volume=.48;async function start(){halted=false;try{await a.play();retry.classList.add('hidden')}catch(e){retry.classList.remove('hidden')}}function trulyStop(){halted=true;a.pause();a.currentTime=0;retry.classList.add('hidden')}function reposition(){const r=move.getBoundingClientRect(),margin=12,w=innerWidth,h=innerHeight;let x=margin+r.width/2+Math.random()*Math.max(0,w-r.width-2*margin),y=margin+r.height/2+Math.random()*Math.max(0,h-r.height-140-2*margin);move.style.left=x+'px';move.style.top=y+'px'}move.addEventListener('click',()=>{taps++;a.volume=Math.min(1,.48+taps*.1);reposition();if(a.paused&&!halted)start()});stop.addEventListener('click',trulyStop);retry.addEventListener('click',start);window.addEventListener('load',start);document.addEventListener('visibilitychange',()=>{if(document.hidden){a.pause()}else if(!halted){start()}});</script></body></html>
